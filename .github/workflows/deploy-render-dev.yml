name: Deploy motion renderer (dev)

# DEV ONLY. The Remotion render service (media/remotion → Cloud Run nomila-render-dev). Built from the repo root because
# the image needs shared/remotionProps.ts. There is no production renderer: the prod API never sets REMOTION_RENDER_URL,
# so its brand book reels stay on the ffmpeg path.
on:
  push:
    branches: [main]
    paths:
      - "media/remotion/**"
      - "shared/remotionProps.ts"
      - "gcp/cloud-run-render-dev.yaml"
      - ".github/workflows/deploy-render-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-render-dev
  cancel-in-progress: false

env:
  PROJECT_ID: gamechanger-pocket-agent
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: gamechanger
  IMAGE: nomila-render

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
          TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          SHA="${GITHUB_SHA:0:8}"
          docker build -f media/remotion/Dockerfile -t "$TAG:$SHA" -t "$TAG:latest" .
          docker push "$TAG:$SHA"
          docker push "$TAG:latest"
          echo "IMAGE_URI=$TAG:$SHA" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          sed -i "s|image: .*|image: ${IMAGE_URI}|" gcp/cloud-run-render-dev.yaml
          gcloud run services replace gcp/cloud-run-render-dev.yaml --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }}
