# The motion renderer (media/remotion) — DEV ONLY. Deployed by .github/workflows/deploy-render-dev.yml.
#
# Private: no allUsers invoker. The dev API's service account (nomila-api-dev) holds roles/run.invoker on this
# service and calls it with an ID token (server/services/remotionRender.ts). Runs as nomila-render-dev, which needs NO
# storage access: per render the API checks every media ref is hers (or shared music / atmosphere) and sends signed READ
# URLs for the inputs and signed WRITE URLs for the reel + poster (30 min); the service fetches / PUTs only those, and
# only on storage.googleapis.com (media/remotion/server/transfer.ts). Its old roles/storage.objectAdmin on the media
# bucket is removed once this is deployed and one render verified (the command is in the PR that made the change).
# One render per instance (concurrency 1): Remotion uses every core it is given.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nomila-render-dev
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: nomila-render-dev@gamechanger-pocket-agent.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - image: us-central1-docker.pkg.dev/gamechanger-pocket-agent/gamechanger/nomila-render:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 20
