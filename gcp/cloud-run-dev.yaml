apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nomila-v2
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: gamechanger-pocket-agent:us-central1:nomila-v2-db
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      # The DEV API's own runtime account (owner script tfprod/10_api_service_accounts.sh, 26 Oct 2026): least
      # privilege, dev resources only (dev DB secret, dev buckets, dev KMS key; the dev TrueForge caller grant is unused
      # since TrueForge was removed, Mastra-only PR 3, 9 Nov 2026). Was the
      # shared gamechanger-runtime@, which prod still uses until its own switch to nomila-api-prod@.
      serviceAccountName: nomila-api-dev@gamechanger-pocket-agent.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/gamechanger-pocket-agent/gamechanger/nomila-v2:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: GCP_PROJECT_ID
              value: "gamechanger-pocket-agent"
            - name: API_BASE_URL
              value: "https://api-dev.nomila.co"
            - name: WEB_APP_URL
              value: "https://nomila-dev.web.app"
            - name: GMAIL_PUBSUB_TOPIC
              value: "projects/gamechanger-pocket-agent/topics/nomila-gmail-notifications"

            # ── Gmail webhook authentication (N1) ────────────────────────────────
            # `verifyPubSubPush` (server/routes/webhooks.ts) enforces ONLY when
            # PUBSUB_PUSH_SA is set — unset means every push is accepted, and the
            # service is invokable by allUsers, so the endpoint was open to anyone
            # who guessed the URL. A forged push advances an athlete's
            # gmail_history_id and permanently skips the real brand mail in between.
            #
            # The subscription-side half was wired up on 2026-08-03 and verified
            # end-to-end (probe push delivered + handled, zero rejections):
            #   - `roles/iam.serviceAccountTokenCreator` on gmail-push@… granted to
            #     the Pub/Sub service agent service-241621020090@gcp-sa-pubsub…
            #   - subscription `nomila-gmail-push` now sends an OIDC token for that
            #     SA with audience = the value below.
            #
            # AUDIENCE MUST MATCH the subscription's --push-auth-token-audience
            # exactly, or every genuine push 403s and Gmail ingestion stops. Check
            # with: gcloud pubsub subscriptions describe nomila-gmail-push
            - name: PUBSUB_PUSH_SA
              value: "gmail-push@gamechanger-pocket-agent.iam.gserviceaccount.com"
            - name: PUBSUB_PUSH_AUDIENCE
              value: "https://nomila-v2-iau7alh5qq-uc.a.run.app"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: NOMILA_V2_DATABASE_URL
                  key: latest
            # Per-instance pg pool size (server/db.ts). nomila-v2-db has max_connections=100
            # (97 usable) and maxScale is 3; with Mastra's pool on top, 3 × (5 + 4) = 27 leaves
            # plenty of room. server/lib/dbPoolBudget.test.ts pins it (cap 95).
            - name: DB_POOL_MAX
              value: "5"
            # Mastra's own pg pool per instance (server/agent/engine/mastra/runtime.ts).
            - name: MILA_MASTRA_POOL_MAX
              value: "4"
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: MOONSHOT_API_KEY
                  key: latest
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ANTHROPIC_API_KEY
                  key: latest
            - name: IG_PAGE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: IG_PAGE_ACCESS_TOKEN
                  key: latest
            - name: IG_BUSINESS_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: IG_BUSINESS_ACCOUNT_ID
                  key: latest
            - name: DISCOVERY_IG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: DISCOVERY_IG_TOKEN
                  key: latest
            - name: DISCOVERY_IG_BUSINESS_ID
              valueFrom:
                secretKeyRef:
                  name: DISCOVERY_IG_BUSINESS_ID
                  key: latest
            # Dev uses the Meta TEST app (created 20 Sep 2026 per docs/runbooks/beta-launch-checklist.md §2a);
            # the live app's credentials — the un-suffixed secrets — belong to production only.
            - name: INSTAGRAM_APP_ID
              valueFrom:
                secretKeyRef:
                  name: INSTAGRAM_APP_ID_DEV
                  key: latest
            - name: INSTAGRAM_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: INSTAGRAM_APP_SECRET_DEV
                  key: latest
            # Instagram API with Instagram Login credentials (distinct from the Facebook
            # INSTAGRAM_APP_* above). The Instagram app id/secret from the Meta console's
            # "API setup with Instagram business login" product.
            - name: INSTAGRAM_LOGIN_APP_ID
              valueFrom:
                secretKeyRef:
                  name: INSTAGRAM_LOGIN_APP_ID_DEV
                  key: latest
            - name: INSTAGRAM_LOGIN_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: INSTAGRAM_LOGIN_APP_SECRET_DEV
                  key: latest
            # Echoed back during the Instagram webhook verification handshake
            # (GET /api/webhooks/instagram). Must match the "Verify token" set in the Meta
            # App Dashboard. Low-sensitivity (it only gates the one-time GET handshake;
            # incoming POSTs are authenticated by the app-secret HMAC), but it lives in
            # Secret Manager since 2026-09-08 so it is not committed in plain text.
            # Rotating it means changing the secret AND the Meta dashboard together.
            - name: META_WEBHOOK_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: META_WEBHOOK_VERIFY_TOKEN
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_ID
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_SECRET_WEB
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OAUTH_CLIENT_SECRET_WEB
                  key: latest
            - name: TIKTOK_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: TIKTOK_CLIENT_KEY
                  key: latest
            - name: TIKTOK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: TIKTOK_CLIENT_SECRET
                  key: latest
            # SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET must be created in Secret Manager
            # before uncommenting these lines (see gcp/setup scripts):
            # - name: SPOTIFY_CLIENT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: SPOTIFY_CLIENT_ID
            #       key: latest
            # - name: SPOTIFY_CLIENT_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: SPOTIFY_CLIENT_SECRET
            #       key: latest
            - name: YOUTUBE_DATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: YOUTUBE_DATA_API_KEY
                  key: latest
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: INTERNAL_CRON_SECRET
                  key: latest
            # SESSION_SECRET — the server-only HMAC key behind OAuth state (server/lib/oauthState.ts),
            # partner-intake tokens, booking session links and the Ask Mila visitor salt. It was
            # mounted nowhere, so all of those fell back to CRON_SECRET — the bearer secret Cloud
            # Scheduler sends in a header, which is the wrong key to sign with (one leak forges all
            # of them). Its own secret, separate per environment (prod mounts SESSION_SECRET_PROD).
            # Changing the key invalidates in-flight OAuth states (10 min) and any partner /
            # booking links already sent from this environment.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: SESSION_SECRET
                  key: latest
            # OpenRouter — b-roll (seedance) and bridges (Kling) submit through it
            # (server/studio/adapters/openrouter.ts). One key for dev and prod (ADI-S20-HOLD2, flip
            # checklist 1b settled as one); the runtime account reads it through its project-level
            # secretAccessor (checked by Adi, 25 Sep 2026). Inert while Studio video is off.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: OPENROUTER_API_KEY
                  key: latest
            - name: VOICE_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: VOICE_SERVICE_SECRET
                  key: latest
            # Signs the athlete-bound voice session grant (server/voice/auth.ts). PLACEHOLDER:
            # the Secret Manager secret must be CREATED (32+ random bytes, runtime SA granted
            # secretAccessor) BEFORE this yaml deploys, or the revision will not start. Server-
            # only — the worker never needs it. Enforcement is the separate VOICE_GRANT_ENFORCE
            # flag (unset = observe mode). See docs/runbooks/voice-grant-rollout.md.
            - name: VOICE_GRANT_SECRET
              valueFrom:
                secretKeyRef:
                  name: VOICE_GRANT_SECRET
                  key: latest
            # VOICE_GRANT_ENFORCE — the internal voice routes REQUIRE the per-session, athlete-bound grant (401 missing /
            # invalid / expired, 403 another athlete's). ON in dev 2 Nov 2026 (owner, never-on decisions): every internal
            # call in mila-voice sends x-voice-grant, and observe mode logged zero "Voice grant check failed" on dev.
            # Rollback: unset it (observe mode). Prod stays off (prod flag guard).
            - name: VOICE_GRANT_ENFORCE
              value: "true"
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef:
                  name: LIVEKIT_URL
                  key: latest
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: LIVEKIT_API_KEY
                  key: latest
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: LIVEKIT_API_SECRET
                  key: latest
            # Ask Mila web voice. Turns on POST /voice/token (server/index.ts) and
            # flips voiceEnabled on the athlete profile, which is what decides
            # whether the mic button renders at all — with this off the button
            # hides itself and the endpoint 404s, so BOTH halves are dark.
            #
            # A plain value, not a secret, precisely so it can be flipped without
            # a deploy in an incident:
            #   gcloud run services update nomila-v2 --region=us-central1 \
            #     --update-env-vars MILA_VOICE_WEB=false
            # That is the kill switch. Note it lasts only until the next deploy
            # re-applies this file, so an incident flip must also land here.
            #
            # The other side of this pipe is the LiveKit Cloud agent `mila-voice`,
            # deployed from the mila-voice repo. Both sides default to that same
            # dispatch name, so MILA_VOICE_AGENT_NAME must stay UNSET here — a
            # stray value routes rooms to a worker name nothing is registered
            # under, and the room simply never gets an agent (no error).
            - name: MILA_VOICE_WEB
              value: "true"
            # MILA_VOICE_ONE — ONE MILA FOR VOICE (server/voice/oneMila): POST /api/internal/voice/session serves the
            # worker Mila's one definition for voice, the chat's CONTEXT and the registry's tools as Gemini Live
            # declarations; POST /api/internal/voice/tool runs every voice tool call through the chat's guarded path
            # (callPassTool), with the athlete from the REQUIRED grant. Off = both routes 404 and the worker keeps its own
            # briefing and tools. ON in dev only (10 Nov 2026); prod stays off (prod flag guard). Kill switch:
            #   gcloud run services update nomila-v2 --region=us-central1 --update-env-vars MILA_VOICE_ONE=false
            - name: MILA_VOICE_ONE
              value: "true"
            # SOCIAL_SUBSTRATE_WRITE — Phase A Step 1a. When true the nightly collectors, the media
            # backfill and the top-post enrichment ALSO write sanitized raw payloads, canonical
            # observations and features beside their existing rows. Nothing reads the substrate
            # in production yet (Step 4 does). Off = the pre-Step-1a code path, byte for byte.
            # SOCIAL_STORIES_WRITE — Phase A Step 1b. Its own flag: Instagram Story sweeps (every 8 h)
            # and the hourly last-look tick write observations only when true. Off at the Step 1b merge
            # in both environments; dev is flipped by a later PR after review, prod stays off.
            # RESEARCH_SUBSTRATE_WRITE — Phase A Step 2a, D3 (a). When true persistResearchRun may write the
            # research substrate (runs, sanitized payloads, cited evidence, facts, state). It turns nothing
            # else on: not the legacy dual-write, not planner execution. Off in both environments.
            - name: RESEARCH_SUBSTRATE_WRITE
              value: "true"
            # RESEARCH_REFRESH_ENABLED — Phase A Step 2b. Half of the ONE execution gate
            # (researchPlannerExecutionEnabled = RESEARCH_REFRESH_ENABLED && RESEARCH_SUBSTRATE_WRITE).
            # Only when BOTH are true may the planner enqueue refresh runs, apply lifecycle transitions,
            # suppress the dev monthly re-enrich or route admin re-research to the planner. Either false
            # ⇒ the planner is dry-run (telemetry row only) and legacy behaviour is untouched.
            - name: RESEARCH_REFRESH_ENABLED
              value: "true"
            # RESEARCH_REFRESH_PROVIDER — D3 (b). Provider binding for research_refresh: "kimi" (v2, default) or
            # "direct" (v3, not built yet — fails closed). Read only when a refresh run executes.
            - name: RESEARCH_REFRESH_PROVIDER
              value: "direct"
            # RESEARCH_PIPELINE_V2_SHADOW — the narrow research pipeline (agent/research/v2: plan → Google-grounded
            # discovery → our own fetch + Readability clean → rank → one extract call) run BESIDE sign-up research for
            # comparison only. It never writes the athlete's record or score; its output stays on its own
            # research_v2_shadow workflow run. Roughly $0.10–0.25 per dev sign-up. Dev only (owner, 25 Oct 2026).
            - name: RESEARCH_PIPELINE_V2_SHADOW
              value: "true"
            # ATHLETE_INDEX_CLAIM — Phase A Step 2c. When true the creation paths (signup, Microsoft,
            # waitlist) search the Athlete Index first and link ONLY on claim proof (existing auth, a
            # unique provider-verified email); every match tier alone creates + records. Off ⇒ the
            # pre-Step-2c creation paths byte for byte. The view, admin ?q= and the dark candidates
            # endpoint mutate nothing and do not depend on this flag.
            - name: ATHLETE_INDEX_CLAIM
              value: "true"
            # SIGNUPS_OPEN — the sign-ups kill switch (server/lib/signups.ts). Only exactly "true" lets the
            # auth paths (signup, Microsoft, waitlist) create a NEW athlete; anything else answers 403
            # { error: "signups_closed" }. Existing users (a matching auth_id) sign in either way.
            - name: SIGNUPS_OPEN
              value: "true"
            # IDENTITY_MEMBERSHIP_READ — Phase A Step 3a. When true requireAuth/requireAdmin resolve the caller through
            # users + athlete_users (design step3 §3.2: exactly one membership ⇒ auto; more ⇒ X-Athlete-Id or 409).
            # Off ⇒ today's athletes.auth_id lookup byte for byte. ON in dev since 12 Sep 2026 (Step 3a rollout step 2).
            - name: IDENTITY_MEMBERSHIP_READ
              value: "true"
            # MAILBOX_LIVE_READS — "Mailbox Owns Correspondence" phase 1 (#776 Gmail, #788 Outlook). When true the
            # conversation view, summarizer, drafter, ask-terms, voice and requalify read the thread LIVE from the
            # mailbox instead of stored bodies; a read failure degrades ("reconnect Gmail") and never changes state.
            # Turned on in dev 7 Oct 2026 after mila-voice #13 (503 handling) was deployed. Dev only.
            - name: MAILBOX_LIVE_READS
              value: "true"
            # BRAND_IDENTITY_GATE — brand research identity gate (#778). When true: brand research is stored only when a
            # grounding source is hosted on the brand's own domain (sender domain, or the advertiser domain literally in the
            # mail); otherwise only enrichment.identity is kept and the profile/images are cleared. Turned on 6 Oct 2026
            # after the reviewed dev backfill (11 brands: 2 confirmed, 9 unconfirmed). Dev only.
            - name: BRAND_IDENTITY_GATE
              value: "true"
            # OUTLOOK_PUSH — Outlook PR 1. When true: an Outlook connect creates a Microsoft Graph change-notification
            # subscription (POST /api/v1/webhooks/outlook + /lifecycle), a notification triggers the existing delta
            # sync within seconds, and the 6h poll becomes a daily backstop per Outlook connection. Off ⇒ no
            # subscription calls and the 6h poll exactly as before. Needs OUTLOOK_WEBHOOK_SECRET (Secret Manager) and
            # the outlook-subscriptions-cron Scheduler job before it is turned on.
            - name: OUTLOOK_PUSH
              value: "false"
            # OUTLOOK_SEND — Outlook replies sent from the app through Microsoft Graph (/me/messages/{id}/reply), only on
            # her tap via the approved pending action (body hash, claim-once). OFF: Outlook reply cards say to reply in
            # Outlook. Even when on, a connection must have granted Mail.Send, which the live OAuth request does not ask
            # for yet; without it the card says to reconnect Outlook. Azure checklist: docs/plans/outlook-send-azure-checklist.md.
            - name: OUTLOOK_SEND
              value: "false"
            # IDENTITY_INTELLIGENCE_ENABLED — Concept 0.4 (#739). When true GET /api/v1/me/story serves the latest
            # identity-intelligence/0.1 projection; off ⇒ { pageState: "unavailable" }. Dev only, for the first real
            # Identity Intelligence run and the preview build (2 Oct 2026). Never set for production.
            - name: IDENTITY_INTELLIGENCE_ENABLED
              value: "true"
            # SHOP_V1 — Her picks (docs/design/shop-her-picks.md): her shelf routes, the /go/:code redirect and the
            # Mila shop tools. Off by default; turning it on for the owner preview is a follow-up (owner's call).
            - name: SHOP_V1
              value: "true"
            # SHOP_SHOPIFY_APP — the catalog-only Shopify app for Her picks (docs/design/shop-her-picks.md §12): /shopify/*,
            # the webhook receiver, the reconcile cron and "From your brands". Needs SHOP_V1. Off by default; the owner turns it on after the Shopify Partner app exists (docs §12 checklist).
            - name: SHOP_SHOPIFY_APP
              value: "false"
            # BOOKINGS_ENABLED — Bookings v2 (paid bookings from her card; server/services/bookings/config.ts). OFF. Even when
            # on, only athletes on BOOKINGS_PILOT_ATHLETE_IDS see it, and the buyer side needs BOOKING_HASH_SECRET (Secret
            # Manager) and email delivery on (EMAIL_PROVIDER=gmail). Turning it on is the owner's call after the pilot checklist.
            - name: BOOKINGS_ENABLED
              value: "true"
            # BOOKINGS_PILOT_ATHLETE_IDS — DEV ONLY: the athletes Bookings v2 is on for (comma-separated athlete ids; empty =
            # nobody). Config data, not code: the owner's existing dev test account + the "Paytest Athlete" dev test account
            # (end-to-end Stripe TEST-mode booking runs; remove when the pilot ends). Never set in prod.
            - name: BOOKINGS_PILOT_ATHLETE_IDS
              value: "dc8f37f1-deff-43f8-8c02-e37a5cc20d4f,dd1a8a80-d31b-423a-a572-9d146716cb0f"
            # BOOKING_HASH_SECRET — HMAC key for buyer email/phone hashes and the buyer page's access key
            # (server/services/bookings/config.ts). Secret Manager, created 12 Oct 2026; never rotate it while
            # bookings exist (old links and hashes stop matching).
            - name: BOOKING_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: BOOKING_HASH_SECRET
                  key: latest
            # PUBLIC_CARD — the public Nomi Card (design-public-card-v3 §15 PR 1–2): the snapshot/publish service, the
            # public reader and her /me/public-card routes. Off by default; turning it on is the owner's call.
            - name: PUBLIC_CARD
              value: "true"
            # ASK_MILA_PUBLIC — public Mila mode on /p/:handle (design-public-card-v3 §4, PR 5): a visitor's chat with Mila
            # over her published card, its two taps, and the free-text box in the page's Mila sheet. Needs PUBLIC_CARD too.
            # Limits are DB-backed; ASK_MILA_DAILY_SPEND_CAP_USD (default 20, "0" = off) caps the spend. Off by default.
            - name: ASK_MILA_PUBLIC
              value: "true"
            # AGENT_V3 — on in dev and prod. It no longer picks the chat's engine (Mila runs on Mastra). It gates the app's new
            # layout (EXPO_PUBLIC_AGENT_V3), including the Studio v3 tab root, and on the server the Studio library route and
            # the onboarding content capability. Studio's own server features use STUDIO_ALL_ON.
            - name: AGENT_V3
              value: "true"
            # AGENT_ONBOARDING — the agent onboarding front + API (server/agent/onboarding; mounted under /api/v1/me,
            # routes dark otherwise). DEV ONLY: on for the new agent experience.
            - name: AGENT_ONBOARDING
              value: "true"
            # SIGNUP_RESEARCH_AGENT — the landing waitlist and the app sign-up (non-agent front) start the agent's
            # research-only run (signup_research: two web-search passes + merge into memory, then the M.I.A. score and
            # the score-ready email) instead of legacy research; agent_onboarding v4 reuses it at first launch.
            # About $1 per sign-up, under DAILY_RESEARCH_CAP_USD. DEV ONLY: on so the dev preview exercises it.
            - name: SIGNUP_RESEARCH_AGENT
              value: "true"
            # QUICK_SCORE_ONE_CALL — new signup_research runs pin v3: beside the two passes, ONE OpenAI web-search call
            # (gpt-6-luna, low search context, the existing search-enabled M.I.A. prompt) gives her a quick score in about
            # a minute (server/services/quickScore). The full research + score still run as before. DEV ONLY (owner, 26 Oct 2026).
            - name: QUICK_SCORE_ONE_CALL
              value: "true"
            # LEAN_SIGNUP_RESEARCH — new signup_research runs pin v4: ONE lean_research step (Wikidata, then OpenAI web
            # search, our own fetch, extract-all, identity, verify; agent/research/v2/lean.ts) replaces the two passes and
            # the merge, then the same facts-only M.I.A. and email; quick_score stays on its own flag. Also offers Mila's
            # refresh_research tool. DEV ONLY (owner, 26 Oct 2026).
            - name: LEAN_SIGNUP_RESEARCH
              value: "true"
            # DAILY_RESEARCH_CAP_USD — the global per-UTC-day cap on sign-up research spend (agent onboarding research,
            # her other model runs in her first week and the M.I.A. score; server/agent/onboarding/dailyCap.ts). Past it a
            # new sign-up's research is queued and the minute workflow tick starts it when there is budget again (the
            # next UTC day at the latest). Unset means no cap. DEV ONLY.
            - name: DAILY_RESEARCH_CAP_USD
              value: "200"
            # ATHLETE_FOOTPRINT_CHECK — the "real athlete?" check (agent/onboarding/footprintCheck.ts; anti-fake plan,
            # owner, 24 Oct 2026): ONE fast-tier OpenAI call with ONE web search (skill onboarding/athlete-footprint,
            # ≤ $0.05, counted in the daily cap above) before the full sign-up research. Not found ⇒ she joins the
            # waitlist, no full research, the landing asks for a team or Instagram (which re-check); the admin list shows
            # no_athlete_footprint. A model error counts as found (fail open). On in prod since 24 Oct 2026; turned on
            # here too so dev matches prod (owner, 31 Oct 2026).
            - name: ATHLETE_FOOTPRINT_CHECK
              value: "true"
            # AGENT_PLAN — the plan step (plan_refresh runs) and its Goals API (server/agent/plan) are on and mounted.
            # DEV ONLY: on for the new agent experience.
            - name: AGENT_PLAN
              value: "true"
            # RESEARCH_MERGE_COMPACT — the research merge answers by pass-fact key and returns only the fields it changes
            # (jobs/research/merge-compact.md); code rebuilds the full merged facts before anything stores or reads
            # them. About half the merge's cost and time. DEV ONLY: on after its equivalence check (replayed dev passes,
            # old vs new, same facts / sources / statuses / conflicts within the old merge's own run-to-run spread).
            - name: RESEARCH_MERGE_COMPACT
              value: "true"
            # AGENT_MOMENTS — the moments scan (server/agent/moments): the first scan at onboarding (before the Brief) and
            # the 12:00 UTC sweep that enqueues weekly moments_scan runs (fast tier + web search, ≈ $0.06–0.12 a scan;
            # caps AGENT_MOMENTS_RUN_CAP_USD 0.25, AGENT_MOMENTS_WEEK_CAP_USD 0.50). DEV ONLY: on for the new agent
            # experience. The scheduler job itself is declared in scripts/provision-schedulers.sh, not yet provisioned.
            - name: AGENT_MOMENTS
              value: "true"
            # AGENT_RESEARCH_REFRESH — the agent research refresh (server/agent/researchRefresh): re-runs the agent's
            # research for one athlete, merges it into her memory (what she said is never overwritten), writes a new
            # Brief that carries her strategy forward, and turns a material change into ONE suggestion she answers.
            # Caps: $1.50 a refresh, $10 a day across all refreshes. DEV ONLY: on so an operator can run it for ONE
            # approved athlete (POST /api/v1/admin/agent/research-refresh/:athleteId).
            - name: AGENT_RESEARCH_REFRESH
              value: "true"
            # AGENT_RESEARCH_REFRESH_COHORT — the daily sweep over everyone (agent-research-refresh-cron). OFF until the
            # first single-athlete result is checked (owner, 12 Oct 2026).
            - name: AGENT_RESEARCH_REFRESH_COHORT
              value: "false"
